{% extends 'base.html' %}

{% block title %}Registrazione | E-Commerce PPM{% endblock %}

{% block content %}
    <h2>Registra un nuovo account Cliente</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Registrati</button>
    </form>
    <p>Hai già un account? <a href="{% url 'accounts:login' %}">Accedi qui</a></p>
{% endblock %}
